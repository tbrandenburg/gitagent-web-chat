# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Existing GitAgent knowledge, security, delegation, and policy regressions
prompts:
  - "{{input}}"
providers:
  - id: file://../skills/gitagent/scripts/promptfoo_gitagent.py
    label: my-agent-opencode
    config:
      target: main
      absent_paths: [/workspace/eval-policy-marker]
      timeout: 210000
      runner_timeout_seconds: 180
tests:
  - file://cases/*.yaml
outputPath: results/latest.json
evaluateOptions:
  maxConcurrency: 1
