daemon off;
worker_processes 1;
pid /tmp/gitagent-gateway/nginx.pid;
# Native PTY tickets can appear in request URLs. Never log request diagnostics.
error_log /dev/null;
events { worker_connections 256; }
http {
    access_log off;
    client_body_temp_path /tmp/gitagent-gateway/body;
    proxy_temp_path /tmp/gitagent-gateway/proxy;
    fastcgi_temp_path /tmp/gitagent-gateway/fastcgi;
    uwsgi_temp_path /tmp/gitagent-gateway/uwsgi;
    scgi_temp_path /tmp/gitagent-gateway/scgi;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    server {
        listen 0.0.0.0:8080;
        server_tokens off;
        auth_basic "OpenCode private sandbox";
        auth_basic_user_file /tmp/gitagent-gateway/htpasswd;
        location / {
            proxy_pass http://127.0.0.1:4096;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 2700s;
            proxy_send_timeout 2700s;
        }
    }
}
