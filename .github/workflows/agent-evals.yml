name: Live agent evaluations
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: skills/gitagent/package-lock.json
      - run: python -m pip install -r skills/gitagent/requirements-dev.txt
      - run: npm ci --prefix skills/gitagent
      - run: make up-opencode
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - run: make eval
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: promptfoo-results
          path: evals/results/
      - run: make down-opencode
        if: always()
