name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: skills/gitagent/package-lock.json
      - run: python -m pip install -r skills/gitagent/requirements-dev.txt
      - run: npm ci --prefix skills/gitagent
      - name: Check portable tooling and agent content
        run: make lint test-tooling test-agent validate doctor
      - name: Validate native Promptfoo configuration (no model calls)
        run: make eval-validate
